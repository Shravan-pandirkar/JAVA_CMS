<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Coaching Management System</title>
    <link rel="stylesheet" href="/frontend/css/student.css">
</head>
<body>

    <div class="form-container">
        <h2>Student Registration</h2>
        <form id="registrationForm">
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" required placeholder="Enter student's full name">
            </div>

            <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" required placeholder="Enter email address">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" required placeholder="Enter phone number">
            </div>

            <div class="form-group">
                <label for="course">Select Course:</label>
                <select id="course" required>
                    <option value="">Select Course</option>
                    <option value="neet">neet</option>
                    <option value="10th">10th</option>
                    <option value="12th">12th</option>
                    <option value="cet">cet</option>
                    <option value="gate">gate</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Register</button>
        </form>
        <a href="/frontend/html/Home_Page.html" class="back-link">&larr; Back to Home</a>
    </div>

    <div id="successPopup" class="popup">Registration successfully!</div>

    <script src="/frontend/js/student.js"></script>
</body>
</html>
